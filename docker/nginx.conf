server {
    listen __PORT__;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;
    gzip_min_length 512;

    # Scraper bookkeeping (e.g. data/.backfill-done) is never served.
    location ~ /\. {
        deny all;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and app shell must always be revalidated so updates reach users.
    location ~ ^/(sw\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Price data (a volume the scraper fills) changes daily; a missing file is a 404, never the app shell.
    location /data/ {
        alias /data/;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        default_type application/json;
    }

    # Client-side routes (/plan, /item/..., /market) fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
