# MIMAROPA catalog: report rows -> app items.
#
# Two report layouts exist in 2026:
#   - until October: short meat list under "FISH" and "LIVESTOCK & POULTRY PRODUCTS"
#     ("Bangus (Large)", "Pork Ham", "Pork Belly", "Whole Chicken", ...)
#   - from November: full layout ("FISH PRODUCTS", "BEEF PRODUCTS", "PORK PRODUCTS", "POULTRY PRODUCTS")
# Both feed the same item where the commodity is the same, so history continues.
#
# Duplicate rows ("Whole Chicken, Local" x4 and similar) are told apart by occurrence.
# The report drops the column that names them, so they are not labelled here. The 4th
# occurrence is the one priced every day and continues the old "Whole Chicken" series
# (same range, 190-230), so that is the featured one.
#
# Rows without an entry are still stored under auto ids (auto.<section>.<name>).

