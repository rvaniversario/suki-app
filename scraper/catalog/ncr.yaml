# NCR catalog: report rows -> app items.
#
# Two report layouts exist in 2026:
#   - until late October: sections "FISH PRODUCTS", "BEEF MEAT PRODUCTS", "PORK MEAT PRODUCTS",
#     "POULTRY PRODUCTS", names like "Beef Brisket, Local" (same wording as MIMAROPA)
#   - from late October: "FISHERIES AND SEAFOOD", "BEEF", "PORK", "CHICKEN", ...
#     names like "Brisket (Punta y Pecho), Local"
# Both feed the same item so history continues. Ids match the MIMAROPA catalog where
# the commodity is the same, so tracked goods carry over when the region changes.
#
# Chicken: the new layout splits Bounty Fresh / Magnolia / Unbranded; the old one
# printed the brand in the specification column ("Unbranded, Fresh", and "Fully Dressed"
# for whole chicken, which the new layout calls "Unbranded"). Items here are the
# unbranded ones.

