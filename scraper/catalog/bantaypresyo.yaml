# Bantay Presyo (Power BI) catalog: COMMODITY -> app item. Shared by every region.
#
# Ids match the MIMAROPA and NCR PDF catalogs where the commodity is the same, so a market's
# price can be shown beside the regional figure and tracked goods carry over between regions.
# The source has no unit column; `unit` here is what the price is per (default kg).
#
# For regions without a PDF report, the regional price is the median across the region's
# markets on each date (see scraper/markets.py).

